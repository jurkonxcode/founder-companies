<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Founder Companies</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ============ TOP BAR ============ -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-logo">FC</div>
        <div class="brand-text">
          <div class="brand-name">Founder Companies</div>
          <small id="brand-sub">Semiconductor Empire · 1995</small>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat">
          <div class="label">Tanggal</div>
          <div class="value" id="stat-date">Jan 1995</div>
        </div>
        <div class="stat">
          <div class="label">Turn</div>
          <div class="value" id="stat-turn">0</div>
        </div>
        <div class="stat">
          <div class="label">Kas</div>
          <div class="value" id="stat-money">$1.00M</div>
        </div>
        <div class="stat">
          <div class="label">Research</div>
          <div class="value" id="stat-rp">0 RP</div>
        </div>
        <div class="stat">
          <div class="label">Market Share</div>
          <div class="value" id="stat-share">2.0%</div>
        </div>
        <div class="stat">
          <div class="label">Engineer</div>
          <div class="value" id="stat-team">0</div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn-ghost" id="btn-save" title="Ctrl+S">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <path d="M17 21v-8H7v8M7 3v5h8"/>
          </svg>
          Simpan
        </button>
        <button class="btn-ghost danger" id="btn-reset" title="Reset game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
          Reset
        </button>
      </div>
    </header>

    <!-- ============ MAIN LAYOUT ============ -->
    <main id="layout">

      <!-- ===== NAVIGATION ===== -->
      <nav id="nav">
        <button class="nav-btn active" data-panel="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </button>

        <button class="nav-btn" data-panel="design">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v6m0 0 4-4m-4 4-4-4M4 12h16M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          </svg>
          <span>Rancang</span>
        </button>

        <button class="nav-btn" data-panel="production">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01"/>
          </svg>
          <span>Produksi</span>
        </button>

        <button class="nav-btn" data-panel="team">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="7" r="3"/>
            <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.87"/>
          </svg>
          <span>Tim</span>
        </button>

        <button class="nav-btn" data-panel="research">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <span>Riset</span>
        </button>

        <button class="nav-btn" data-panel="market">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18M7 15l4-4 4 3 5-7"/>
          </svg>
          <span>Pasar</span>
        </button>

        <button class="nav-btn" data-panel="finance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Keuangan</span>
        </button>
      </nav>

      <!-- ===== MAIN PANEL ===== -->
      <section id="panel">
        <div class="panel-head">
          <h2 id="panel-title">Dashboard</h2>
          <span class="hint" id="panel-hint">overview</span>
        </div>
        <div id="panel-body">
          <!-- diisi oleh ui/*.js -->
        </div>
      </section>

      <!-- ===== NEWS FEED ===== -->
      <aside id="log">
        <div class="panel-head">
          <h2>News Feed</h2>
          <span class="hint" id="log-count">0</span>
        </div>
        <div id="log-body"></div>
      </aside>
    </main>

    <!-- ============ BOTTOM BAR ============ -->
    <footer id="bottombar">
      <div class="bb-left">
        <span class="bb-label">Turn</span>
        <span class="bb-value" id="bb-turn">0</span>
        <span class="bb-sep">·</span>
        <span class="bb-label">Tanggal</span>
        <span class="bb-value" id="bb-date">Jan 1995</span>
      </div>
      <div class="bb-center">
        <span class="bb-note" id="bb-note">Siap untuk turn berikutnya.</span>
      </div>
      <div class="bb-right">
        <button class="btn-next-turn" id="btn-next-turn">
          Next Turn
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
    </footer>

    <div id="toast-wrap"></div>
    <div id="modal-wrap"></div>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <!-- data -->
  <script src="js/data/tech.js"></script>
  <script src="js/data/isa.js"></script>
  <script src="js/data/engineers.js"></script>
  <script src="js/data/segments.js"></script>
  <script src="js/data/competitors.js"></script>
  <script src="js/data/events.js"></script>

  <!-- systems -->
  <script src="js/systems/chipDesign.js"></script>
  <script src="js/systems/production.js"></script>
  <script src="js/systems/team.js"></script>
  <script src="js/systems/research.js"></script>
  <script src="js/systems/market.js"></script>
  <script src="js/systems/finance.js"></script>

  <!-- state -->
  <script src="js/state.js"></script>

  <!-- ui -->
  <script src="js/ui/layout.js"></script>
  <script src="js/ui/panelDashboard.js"></script>
  <script src="js/ui/panelDesign.js"></script>
  <script src="js/ui/panelProduction.js"></script>
  <script src="js/ui/panelTeam.js"></script>
  <script src="js/ui/panelResearch.js"></script>
  <script src="js/ui/panelMarket.js"></script>
  <script src="js/ui/panelFinance.js"></script>

  <!-- main -->
  <script src="js/main.js"></script>
</body>
  </html>
